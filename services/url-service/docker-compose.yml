services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes:
      - url-service-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_service -d url_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  url-service-postgres:
